name: "Bump version and sync"
on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 * * *

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.repository == 'tree-sitter/tree-sitter-scala'
    steps:
      - name: checkout tree-sitter-scala
        uses: actions/checkout@v6

      - name: Check whether the current version is already tagged
        id: check
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already tagged"
            echo "tagged=true" >> $GITHUB_OUTPUT
          else
            echo "v$VERSION is not tagged yet"
            echo "tagged=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump patch version
        id: bump
        if: steps.check.outputs.tagged == 'true'
        run: |
          script/bump_version.sh
          NEXT=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "next=$NEXT" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.tagged == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          title: "chore: bump to ${{ steps.bump.outputs.next }}"
          commit-message: "chore: bump to ${{ steps.bump.outputs.next }}"
          body: "v${{ steps.check.outputs.version }} is already tagged, so this bumps the version to ${{ steps.bump.outputs.next }}."
          branch: bump-version
          delete-branch: true

  sync:
    needs: bump
    runs-on: ubuntu-latest
    if: github.repository == 'tree-sitter/tree-sitter-scala'
    outputs:
      all: ${{ steps.changes.outputs.all}}
      c: ${{ steps.changes.outputs.c }}
    steps:
      - name: checkout tree-sitter-scala
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v0.26.8

      - name: Generate parser from scratch
        shell: bash
        run: tree-sitter generate

      - name: Format Javascipt
        run: |
          npm install
          export PATH=./node_modules/.bin:$PATH
          prettier --write --ignore-unknown grammar.js

      - name: Check for changes
        uses: tj-actions/verify-changed-files@v19
        id: verify-changed-files
        with:
          files: |
            bindings/c/tree-sitter-scala.h
            bindings/c/tree-sitter-scala.pc.in
            grammar.js
            src/grammar.json
            src/node-types.json
            src/parser.c
            src/tree_sitter/alloc.h
            src/tree_sitter/array.h
            src/tree_sitter/parser.h

      - name: Commit changes if necessary
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config user.name "GitHub"
          git config user.email "noreply@github.com"
          git add .
          LAST_COMMIT=$(git log --format="%H" -n 1)
          git commit -m "chore: generate and sync from $LAST_COMMIT"
          git clean -xf

      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          title: "chore: generate and sync latest changes"
          branch: generation
          base: ${{ github.head_ref }}

      - name: No changes detected
        if: steps.verify-changed-files.outputs.files_changed == 'false'
        run: echo "No changes detected"
